<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Receipt Demo</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #111;
}

body {
    font-family: "Noto Serif Ethiopic", "Nyala", "Times New Roman", serif;
}

.demo-label {
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    color: #8b0000;
    padding: 5px;
}

.receipt {
    width: 96%;
    max-width: 700px;
    margin: 0 auto;
    text-align: center;
}

h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    font-weight: bold;
    margin: 0 0 25px 0;
    line-height: 1.2;
}

.details {
    font-size: 16px;
    font-weight: bold;
    line-height: 1.35;
}

.details p {
    margin: 2px 0;
    padding: 0;
}

.demo-footer {
    width: 260px;
    max-width: 90%;
    margin: 22px auto 0;
    padding: 5px;
    border: 1px solid #8b0000;
    color: #8b0000;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 9px;
    font-weight: bold;
}

@media (max-width: 500px) {
    h1 {
        font-size: 18px;
    }

    .details {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="demo-label">
    DEMO / NOT AN OFFICIAL RECEIPT
</div>

<div class="receipt">

    <h1>Ministry of Revenue: Valid Receipt</h1>

    <div class="details">
        <p>የደረሰኝ መለያ ቁጥር: 795</p>
        <p>የደረሰኝ ሁኔታ: DEMO</p>
        <p>ይህ ገጽ ለማሳያ እና ለሙከራ ብቻ ነው።</p>
    </div>

    <div class="demo-footer">
        DEMO / NOT AN OFFICIAL RECEIPT
    </div>

</div>

</body>
</html>
